# Packages Rave Laboratory with its own Python for Windows, macOS and Linux, then test-launches each package.
# Push a tag like v1.0.0 (or run it by hand) and the packages are attached to the release.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      frozen:
        description: 'Also build the alternative PyInstaller (frozen) packages'
        type: boolean
        default: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pillow
      - run: python ravelab.py --selftest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: python build_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: windows-x64.zip
            run: cmd /c "Rave Laboratory (console).bat" --selftest
          - os: macos-latest
            file: macos-apple-silicon.tar.gz
            run: ./Rave\ Laboratory.command --selftest
          - os: ubuntu-latest
            file: linux-x64.tar.gz
            run: ./Rave\ Laboratory.sh --selftest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: unpack
        shell: bash
        run: |
          f=$(ls dist/*-${{ matrix.file }})
          case "$f" in *.zip) unzip -q "$f";; *) tar xzf "$f";; esac
      - name: launch
        shell: bash
        working-directory: Rave Laboratory
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ${{ matrix.run }}
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
  frozen:
    # the alternative single-executable build, kept for transparency; on request only, never attached to a release
    if: github.event_name == 'workflow_dispatch' && inputs.frozen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller pillow
      - run: python build_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-${{ matrix.os }}
          path: dist-frozen/*.zip
